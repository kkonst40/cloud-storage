services:
  db:
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_prod_data:/var/lib/postgresql/data

  minio:
    volumes:
      - minio_prod_data:/data

  redis:
    volumes:
      - redis_prod_data:/data

  migrator:
    env_file:
      - ./backend/.env.prod

  backend:
    env_file:
      - ./backend/.env.prod

volumes:
  postgres_prod_data:
  minio_prod_data:
  redis_prod_data: