services:
  db:
    volumes:
      - ./docker/postgres/init_test.sql:/docker-entrypoint-initdb.d/init_test.sql
      - postgres_dev_data:/var/lib/postgresql/data

  minio:
    volumes:
      - minio_dev_data:/data

  redis:
    volumes:
      - redis_dev_data:/data

  migrator:
    env_file:
      - ./backend/.env.dev

  backend:
    env_file:
      - ./backend/.env.dev

volumes:
  postgres_dev_data:
  minio_dev_data:
  redis_dev_data: